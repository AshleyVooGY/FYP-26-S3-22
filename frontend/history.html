<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reading History — News Release System</title>

    <link rel="stylesheet" href="css/shell.css" />

    <link rel="stylesheet" href="css/feature5.css" />

    <link rel="stylesheet" href="css/feature3.css" />
  </head>

  <body>
    <!-- =====================================================
     TOP BAR
  ====================================================== -->

    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__brand-icon"> 📰 </span>

        <span> NEWS RELEASE SYSTEM </span>
      </div>

      <nav class="topbar__nav">
        <a href="index.html"> Home </a>

        <a href="#" class="is-disabled" title="Coming soon"> Categories ▾ </a>

        <a href="trending.html"> Trending </a>

        <a href="#" class="is-disabled" title="Coming soon"> Bookmarks </a>
      </nav>

      <div class="topbar__actions">
        <input
          class="topbar__search"
          type="text"
          placeholder="Search news..."
          disabled
          title="Coming soon"
        />

        <button class="icon-btn" title="Coming soon">🔔</button>

        <button class="btn-publish" title="Coming soon">+ Publish</button>

        <a href="login.html" class="user-chip" id="user-chip">
          <span class="user-chip__avatar"> 👤 </span>

          <span id="user-label"> Guest </span>
        </a>
      </div>
    </header>

    <!-- =====================================================
       PAGE LAYOUT
  ====================================================== -->

    <div class="layout">
      <!-- ===================================================
        SIDEBAR
    ==================================================== -->

      <aside class="sidebar">
        <nav class="sidebar__nav">
          <a href="index.html">
            <span class="sidebar__icon"> 📊 </span>

            Dashboard
          </a>

          <a href="#" class="is-disabled" title="Coming soon">
            <span class="sidebar__icon"> 📰 </span>

            My Articles
          </a>

          <a href="#" class="is-disabled" title="Coming soon">
            <span class="sidebar__icon"> ✏️ </span>

            Drafts
          </a>

          <a href="#" class="is-disabled" title="Coming soon">
            <span class="sidebar__icon"> 🔖 </span>

            Bookmarks
          </a>

          <a href="history.html" class="is-active">
            <span class="sidebar__icon"> 🕘 </span>

            History
          </a>

          <a href="preferences.html">
            <span class="sidebar__icon"> ⚙️ </span>

            Preferences
          </a>

          <a href="#" class="is-disabled" title="Coming soon">
            <span class="sidebar__icon"> 🛠 </span>

            Settings
          </a>

          <a href="#" class="is-disabled" title="Coming soon">
            <span class="sidebar__icon"> ↩ </span>

            Logout
          </a>
        </nav>
      </aside>

      <!-- ===================================================
         MAIN CONTENT
    ==================================================== -->

      <main class="content">
        <section class="history-page">
          <h1 class="history-title">Reading History</h1>

          <p class="history-subtitle">Articles you have previously viewed</p>

          <div id="historyGrid" class="history-grid">
            <p class="state-message">Loading reading history…</p>
          </div>
        </section>
      </main>
    </div>

    <!-- =====================================================
       SCRIPTS
  ====================================================== -->

    <script type="module" src="js/auth.js"></script>

    <script type="module" src="js/history.js"></script>
