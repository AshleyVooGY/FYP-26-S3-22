<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — News Release System</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/auth.css?v=plan-picker-20261021" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">NEWS RELEASE SYSTEM</div>
      <h1 class="auth-title">Reset password</h1>
      <p id="recovery-description" class="auth-subtitle">Enter your login email to request a secure password reset link.</p>
      <div id="recovery-message" role="status" aria-live="polite"></div>
      <form id="reset-request-form">
        <div class="form-group">
          <label for="reset-email">Login email</label>
          <input class="form-input" id="reset-email" type="email" maxlength="254" required autocomplete="email" />
        </div>
        <button class="auth-submit" id="request-reset" type="submit">Send reset email</button>
      </form>
      <form id="new-password-form" hidden>
        <div class="form-group">
          <label for="new-password">New password</label>
          <input class="form-input" id="new-password" type="password" minlength="12" maxlength="128" required autocomplete="new-password" aria-describedby="password-help" />
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm new password</label>
          <input class="form-input" id="confirm-password" type="password" minlength="12" maxlength="128" required autocomplete="new-password" />
        </div>
        <p id="password-help" class="auth-subtitle">Use 12–128 characters. Choose a unique password you do not use elsewhere.</p>
        <button class="auth-submit" id="update-password" type="submit">Set new password</button>
      </form>
      <p class="auth-footer"><a href="login.html">Back to login</a></p>
    </div>
  </main>
  <script type="module" src="js/reset-password.js?v=account-settings-20261027"></script>
</body>
</html>
