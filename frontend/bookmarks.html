<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Bookmarks — News Release System
    </title>

    <!-- Same shared shell as index.html -->
    <link
        rel="stylesheet"
        href="css/shell.css"
    >

    <!-- Feature 3 -->
    <link
        rel="stylesheet"
        href="css/feature3.css"
    >

</head>


<body>


    <!-- ==================================================
         TOP BAR
    ================================================== -->

    <header class="topbar">


        <!-- BRAND -->

        <div class="topbar__brand">

            <span class="topbar__brand-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="3"
                        y="4"
                        width="14"
                        height="16"
                        rx="1.5"
                    />

                    <path
                        d="M17 8.5h4V18a2 2 0 0 1-2 2h-2"
                    />

                    <line
                        x1="6.5"
                        y1="8.5"
                        x2="13.5"
                        y2="8.5"
                    />

                    <line
                        x1="6.5"
                        y1="12"
                        x2="13.5"
                        y2="12"
                    />

                    <line
                        x1="6.5"
                        y1="15.5"
                        x2="11"
                        y2="15.5"
                    />

                </svg>

            </span>

            <span>
                NEWS RELEASE SYSTEM
            </span>

        </div>


        <!-- TOP NAVIGATION -->

        <nav class="topbar__nav">

            <a href="index.html">
                Home
            </a>

            <a
                href="categories.html"
                class=""

            >
                Categories ▾
            </a>

            <a href="trending.html">
                Trending
            </a>

            <a
                href="bookmarks.html"
                class="is-active"
            >
                Bookmarks
            </a>

        </nav>


        <!-- TOP ACTIONS -->

        <div class="topbar__actions">

            <input
                class="topbar__search"
                type="text"
                placeholder="Search news..."
                disabled
                title="Coming soon"
            >


            <button
                class="icon-btn"
                type="button"
                title="Coming soon"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M18 8a6 6 0 0 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 14.5 18 8z"
                    />

                    <path
                        d="M13.7 20a2 2 0 0 1-3.4 0"
                    />

                </svg>

            </button>


            <a
                class="btn-publish is-live"
                href="article-editor.html"
            >
                + Publish
            </a>


            <a
                href="login.html"
                class="user-chip"
                id="user-chip"
            >

                <span class="user-chip__avatar">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M20 21v-1.5A4.5 4.5 0 0 0 15.5 15h-7A4.5 4.5 0 0 0 4 19.5V21"
                        />

                        <circle
                            cx="12"
                            cy="7.5"
                            r="4"
                        />

                    </svg>

                </span>

                <span id="user-label">
                    Guest
                </span>

            </a>

        </div>

    </header>


    <!-- ==================================================
         PAGE LAYOUT
    ================================================== -->

    <div class="layout">


        <!-- ==================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar" aria-label="Account navigation"></aside>


        <!-- ==================================================
             MAIN CONTENT
        ================================================== -->

        <main class="content">


            <h2 class="section-title">
                Bookmarks
            </h2>


            <!-- Loading -->

            <p
                id="bookmark-loading"
                class="state-message"
            >
                Loading bookmarks…
            </p>


            <!-- Error -->

            <p
                id="bookmark-error"
                class="state-message is-error hidden"
            ></p>


            <!-- Empty -->

            <div
                id="bookmark-empty"
                class="bookmark-empty hidden"
            >

                <div class="bookmark-empty__icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M6 3h12a1 1 0 0 1 1 1v17l-7-5-7 5V4a1 1 0 0 1 1-1z"
                        />

                    </svg>

                </div>


                <h2>
                    No bookmarked articles
                </h2>


                <p>
                    Articles you bookmark will appear here.
                </p>


                <a
                    href="trending.html"
                    class="bookmark-empty__button"
                >
                    Browse Trending
                </a>

            </div>


            <!-- Bookmark Cards -->

            <section
                id="bookmark-grid"
                class="bookmark-grid"
            ></section>


        </main>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="js/auth.js?v=account-name-20261029"
    ></script>

    <script
        type="module"
        src="js/bookmarks.js?v=shared-account-name-20261029"
    ></script>


</body>

</html>
