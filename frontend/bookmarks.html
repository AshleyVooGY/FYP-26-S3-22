<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Bookmarks — News Release System
    </title>


    <!-- Shared website styling -->
    <link
        rel="stylesheet"
        href="css/shell.css"
    >


    <!-- Feature 3 styling -->
    <link
        rel="stylesheet"
        href="css/feature3.css"
    >

</head>


<body>


    <!-- ==================================================
         TOP NAVIGATION
    ================================================== -->

    <header class="topbar">


        <!-- BRAND -->

        <div class="topbar__brand">

            <span class="topbar__brand-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="3"
                        y="4"
                        width="14"
                        height="16"
                        rx="1.5"
                    />

                    <path
                        d="M17 8.5h4V18a2 2 0 0 1-2 2h-2"
                    />

                    <line
                        x1="6.5"
                        y1="8.5"
                        x2="13.5"
                        y2="8.5"
                    />

                    <line
                        x1="6.5"
                        y1="12"
                        x2="13.5"
                        y2="12"
                    />

                    <line
                        x1="6.5"
                        y1="15.5"
                        x2="11"
                        y2="15.5"
                    />

                </svg>

            </span>

            <span>
                NEWS RELEASE SYSTEM
            </span>

        </div>


        <!-- TOP NAVIGATION -->

        <nav class="topbar__nav">

            <a href="index.html">
                Home
            </a>


            <a
                href="#"
                class="is-disabled"
                title="Coming soon"
            >
                Categories ▾
            </a>


            <a href="trending.html">
                Trending
            </a>


            <a
                href="bookmarks.html"
                class="is-active"
            >
                Bookmarks
            </a>

        </nav>


        <!-- TOP ACTIONS -->

        <div class="topbar__actions">


            <input
                class="topbar__search"
                type="text"
                placeholder="Search news..."
                disabled
                title="Coming soon"
            >


            <button
                class="icon-btn"
                type="button"
                title="Coming soon"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M18 8a6 6 0 0 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 14.5 18 8z"
                    />

                    <path
                        d="M13.7 20a2 2 0 0 1-3.4 0"
                    />

                </svg>

            </button>


            <button
                class="btn-publish"
                type="button"
                title="Coming soon"
            >
                + Publish
            </button>


            <a
                href="login.html"
                class="user-chip"
                id="user-chip"
            >

                <span class="user-chip__avatar">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M20 21v-1.5A4.5 4.5 0 0 0 15.5 15h-7A4.5 4.5 0 0 0 4 19.5V21"
                        />

                        <circle
                            cx="12"
                            cy="7.5"
                            r="4"
                        />

                    </svg>

                </span>

                <span id="user-label">
                    Guest
                </span>

            </a>

        </div>

    </header>


    <!-- ==================================================
         MAIN LAYOUT
    ================================================== -->

    <div class="layout">


        <!-- ==================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">


            <nav class="sidebar__nav">


                <!-- Dashboard -->

                <a href="index.html">

                    <span class="sidebar__icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M3 10.5 12 3l9 7.5"
                            />

                            <path
                                d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"
                            />

                        </svg>

                    </span>

                    Dashboard

                </a>


                <!-- My Articles -->

                <a
                    href="#"
                    class="is-disabled"
                    title="Coming soon"
                >

                    <span class="sidebar__icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"
                            />

                            <path
                                d="M15 2v5h5"
                            />

                            <path
                                d="M8 13h8"
                            />

                            <path
                                d="M8 17h8"
                            />

                        </svg>

                    </span>

                    My Articles

                </a>


                <!-- Drafts -->

                <a
                    href="#"
                    class="is-disabled"
                    title="Coming soon"
                >

                    <span class="sidebar__icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <rect
                                x="3"
                                y="3"
                                width="18"
                                height="18"
                                rx="3"
                            />

                            <path
                                d="M14.5 8.5a1.5 1.5 0 0 1 2 2L10 17l-3 1 1-3z"
                            />

                        </svg>

                    </span>

                    Drafts

                </a>


                <!-- BOOKMARKS -->

                <a
                    href="bookmarks.html"
                    class="is-active"
                >

                    <span class="sidebar__icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M6 3h12a1 1 0 0 1 1 1v17l-7-5-7 5V4a1 1 0 0 1 1-1z"
                            />

                        </svg>

                    </span>

                    Bookmarks

                </a>


                <!-- HISTORY -->

                <a href="history.html">

                    <span class="sidebar__icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4.5 7-10.5 7S1.5 12 1.5 12z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />

                        </svg>

                    </span>

                    History

                </a>


                <!-- PREFERENCES -->

                <a href="preferences.html">

                    <span class="sidebar__icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <line
                                x1="5"
                                y1="21"
                                x2="5"
                                y2="13"
                            />

                            <line
                                x1="5"
                                y1="9"
                                x2="5"
                                y2="3"
                            />

                            <line
                                x1="12"
                                y1="21"
                                x2="12"
                                y2="11"
                            />

                            <line
                                x1="12"
                                y1="7"
                                x2="12"
                                y2="3"
                            />

                            <line
                                x1="19"
                                y1="21"
                                x2="19"
                                y2="15"
                            />

                            <line
                                x1="19"
                                y1="11"
                                x2="19"
                                y2="3"
                            />

                            <circle
                                cx="5"
                                cy="11"
                                r="2"
                            />

                            <circle
                                cx="12"
                                cy="9"
                                r="2"
                            />

                            <circle
                                cx="19"
                                cy="13"
                                r="2"
                            />

                        </svg>

                    </span>

                    Preferences

                </a>


                <!-- SETTINGS -->

                <a
                    href="#"
                    class="is-disabled"
                    title="Coming soon"
                >

                    <span class="sidebar__icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />

                            <path
                                d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1A1.7 1.7 0 0 0 19.4 9c.2.6.8 1 1.5 1h.1a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
                            />

                        </svg>

                    </span>

                    Settings

                </a>


            </nav>


            <!-- LOGOUT -->

            <div class="sidebar__bottom">

                <a
                    href="login.html"
                    class="sidebar__logout"
                >

                    <span class="sidebar__icon">
                        ↪
                    </span>

                    Logout

                </a>

            </div>


        </aside>


        <!-- ==================================================
             MAIN CONTENT
        ================================================== -->

        <main class="content">


            <!-- PAGE TITLE -->

            <h1 class="section-title">
                Bookmarks
            </h1>


            <!-- LOADING -->

            <div
                id="bookmark-loading"
                class="state-message"
            >
                Loading bookmarks…
            </div>


            <!-- ERROR -->

            <div
                id="bookmark-error"
                class="state-message is-error hidden"
            ></div>


            <!-- EMPTY -->

            <div
                id="bookmark-empty"
                class="bookmark-empty hidden"
            >

                <div class="bookmark-empty__icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M6 3h12a1 1 0 0 1 1 1v17l-7-5-7 5V4a1 1 0 0 1 1-1z"
                        />

                    </svg>

                </div>


                <h2>
                    No bookmarked articles
                </h2>


                <p>
                    Articles you bookmark will appear here.
                </p>


                <a
                    href="trending.html"
                    class="bookmark-empty__button"
                >
                    Browse Trending
                </a>

            </div>


            <!-- ==================================================
                 BOOKMARK CARDS
            ================================================== -->

            <section
                id="bookmark-grid"
                class="bookmark-grid"
            ></section>


        </main>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="js/auth.js"
    ></script>


    <script
        type="module"
        src="js/bookmarks.js"
    ></script>


</body>

</html>
