<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories, Search and Recommendations — News Release System</title>
  <link rel="stylesheet" href="../css/shell.css">
  <link rel="stylesheet" href="./features.css">
</head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="../index.html" aria-label="News Release System home">
      <span class="topbar__brand-icon" aria-hidden="true">▣</span>
      <span>NEWS RELEASE SYSTEM</span>
    </a>

    <nav class="topbar__nav" aria-label="Primary navigation">
      <a href="../index.html">Home</a>
      <div class="category-menu">
        <button id="category-menu-button" class="category-menu__button" type="button" aria-expanded="false">
          Categories <span aria-hidden="true">⌄</span>
        </button>
        <div id="category-menu" class="category-menu__panel" hidden>
          <button type="button" data-open-browse>Browse categories &amp; tags</button>
          <button type="button" data-open-manage>Manage categories &amp; tags</button>
        </div>
      </div>
      <a href="../trending.html">Trending</a>
      <a href="../bookmarks.html">Bookmarks</a>
    </nav>

    <div class="topbar__actions">
      <form id="quick-search-form" class="quick-search" role="search">
        <input id="quick-search" class="topbar__search" type="search" placeholder="Search news..." aria-label="Search news">
        <button class="sr-only" type="submit">Submit search</button>
      </form>
      <button class="icon-btn" type="button" aria-label="Notifications">♧</button>
      <a class="btn-publish" href="../article-editor.html">+ Publish</a>
      <a class="user-chip" href="../login.html">
        <span class="user-chip__avatar" aria-hidden="true">●</span>
        <span id="user-label">Guest</span>
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="sidebar__nav" aria-label="Account navigation">
        <a href="../index.html"><span class="sidebar__icon">▦</span>Dashboard</a>
        <a href="../my-articles.html"><span class="sidebar__icon">◇</span>My Articles</a>
        <a href="../drafts.html"><span class="sidebar__icon">✎</span>Drafts</a>
        <a href="../bookmarks.html"><span class="sidebar__icon">▱</span>Bookmarks</a>
        <a href="../history.html"><span class="sidebar__icon">◉</span>History</a>
        <a href="../preferences.html"><span class="sidebar__icon">⌘</span>Preferences</a>
        <a href="../login.html"><span class="sidebar__icon">⚙</span>Account</a>
      </nav>
    </aside>

    <main id="app" class="content" tabindex="-1" aria-live="polite">
      <div class="loading-panel">Loading news…</div>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
