<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trending & Popular News</title>
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/feature5.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__brand-icon">📰</span>
      <span>NEWS RELEASE SYSTEM</span>
    </div>
    <nav class="topbar__nav">
      <a href="index.html">Home</a>
      <a href="#" class="is-disabled" title="Coming soon">Categories ▾</a>
      <a href="trending.html" class="is-active">Trending</a>
      <a href="#" class="is-disabled" title="Coming soon">Bookmarks</a>
    </nav>
    <div class="topbar__actions">
      <input class="topbar__search" type="text" placeholder="Search news..." disabled title="Coming soon" />
      <button class="icon-btn" title="Coming soon">🔔</button>
      <button class="btn-publish" title="Coming soon">+ Publish</button>
      <a href="login.html" class="user-chip" id="user-chip">
        <span class="user-chip__avatar">👤</span>
        <span id="user-label">Guest</span>
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="sidebar__nav">
        <a href="index.html"><span class="sidebar__icon">📊</span>Dashboard</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">📰</span>My Articles</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">✏️</span>Drafts</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">🔖</span>Bookmarks</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">🕘</span>History</a>
        <a href="preferences.html"><span class="sidebar__icon">⚙️</span>Preferences</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">🛠</span>Settings</a>
        <a href="#" data-logout><span class="sidebar__icon">↩</span>Logout</a>
      </nav>
    </aside>

    <main class="content">
      <h1 class="section-title" style="font-size:20px;">Trending & Popular News</h1>

      <div class="trending-toolbar">
        <div class="tabs" id="tabs"></div>
        <div class="sort-control">
          <label for="sort-select">Sort by:</label>
          <select id="sort-select">
            <option value="popularity">Most Popular</option>
            <option value="recent">Most Recent</option>
            <option value="views">Most Viewed</option>
          </select>
        </div>
      </div>

      <p id="tab-note" class="state-message" style="padding-top:0;"></p>

      <div id="rank-list" class="rank-list">
        <p class="state-message">Loading…</p>
      </div>

      <div id="pagination" class="pagination"></div>
    </main>
  </div>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/trending.js"></script>
</body>
</html>
