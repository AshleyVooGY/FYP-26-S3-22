<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Release System</title>
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/feature5.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__brand-icon">📰</span>
      <span>NEWS RELEASE SYSTEM</span>
    </div>
    <nav class="topbar__nav">
      <a href="index.html" class="is-active">Home</a>
      <a href="#" class="is-disabled" title="Coming soon">Categories ▾</a>
      <a href="trending.html">Trending</a>
      <a href="#" class="is-disabled" title="Coming soon">Bookmarks</a>
    </nav>
    <div class="topbar__actions">
      <input class="topbar__search" type="text" placeholder="Search news..." disabled title="Coming soon" />
      <button class="icon-btn" title="Coming soon">🔔</button>
      <button class="btn-publish" title="Coming soon">+ Publish</button>
      <a href="login.html" class="user-chip" id="user-chip">
        <span class="user-chip__avatar">👤</span>
        <span id="user-label">Guest</span>
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="sidebar__nav">
        <a href="index.html" class="is-active"><span class="sidebar__icon">📊</span>Dashboard</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">📰</span>My Articles</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">✏️</span>Drafts</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">🔖</span>Bookmarks</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">🕘</span>History</a>
        <a href="preferences.html"><span class="sidebar__icon">⚙️</span>Preferences</a>
        <a href="#" class="is-disabled" title="Coming soon"><span class="sidebar__icon">🛠</span>Settings</a>
        <a href="#" data-logout><span class="sidebar__icon">↩</span>Logout</a>
      </nav>
    </aside>

    <main class="content">
      <h2 class="section-title">Featured News</h2>
      <div id="featured-slot">
        <p class="state-message">Loading featured article…</p>
      </div>

      <div class="home-grid">
        <section>
          <h2 class="section-title">Latest News</h2>
          <div id="latest-list" class="latest-list">
            <p class="state-message">Loading latest news…</p>
          </div>
        </section>

        <section>
          <div class="trending-panel__head">
            <h2 class="section-title">Trending Today 🔥</h2>
            <a class="view-more" href="trending.html">View More →</a>
          </div>
          <div id="trending-grid" class="trending-grid">
            <p class="state-message">Loading trending news…</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
