<html lang="en">
<head>

  <link rel="stylesheet" href="features-01-02-10/features.css" />

</head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="index.html">
      <span class="topbar__brand-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <rect
            x="3"
            y="4"
            width="14"
            height="16"
            rx="1.5"
          />

          <path
            d="M17 8.5h4V18a2 2 0 0 1-2 2h-2"
          />

          <line
            x1="6.5"
            y1="8.5"
            x2="13.5"
            y2="8.5"
          />

          <line
            x1="6.5"
            y1="12"
            x2="13.5"
            y2="12"
          />

          <line
            x1="6.5"
            y1="15.5"
            x2="11"
            y2="15.5"
          />

        </svg>

      </span>
      <span>NEWS RELEASE SYSTEM</span>
    </a>
    <nav class="topbar__nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="categories.html">Categories ▾</a>
      <a href="trending.html">Trending</a>
      <a href="bookmarks.html">Bookmarks</a>
    </nav>
    <div class="topbar__actions">
      <form action="search.html" method="get" role="search">
        <input class="topbar__search" name="q" type="search" placeholder="Search news..." aria-label="Search news" />
      </form>
      <button class="icon-btn" title="Coming soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 14.5 18 8z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg></button>
      <a class="btn-publish is-live" href="article-editor.html">+ Publish</a>
      <a href="login.html" class="user-chip" id="user-chip">
        <span class="user-chip__avatar">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <path
              d="M20 21v-1.5A4.5 4.5 0 0 0 15.5 15h-7A4.5 4.5 0 0 0 4 19.5V21"
            />

            <circle
              cx="12"
              cy="7.5"
              r="4"
            />

          </svg>

        </span>
        <span id="user-label">User</span>
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Account navigation"></aside>

    <main class="content" id="for-you-app" tabindex="-1">
      <header class="page-head"><div><h1>For You</h1><p>News for your interests, plus stories to discover.</p></div><a class="button" href="preferences.html">Edit preferences</a></header>
      <p id="feed-status" role="status" aria-live="polite">Loading your news…</p>
      <div id="feed-state"></div>
      <div id="feed-grid" class="article-grid"></div>
      <div class="feed-actions"><button class="button" type="button" id="feed-more" hidden>Load more</button><button class="button" type="button" id="feed-refresh" hidden>Refresh recommendations</button></div>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/for-you.js?v=for-you-20261020"></script>

</html>
