<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — News Release System</title>
  <link rel="stylesheet" href="../css/shell.css" />
</head>
<body>
  <main class="content">
    <p class="state-message">Opening the updated News Release System…</p>
    <noscript>
      <p><a href="../categories.html">Continue to Categories</a></p>
    </noscript>
  </main>
  <script>
    (() => {
      const hash = window.location.hash.slice(1);
      const query = new URLSearchParams(window.location.search);
      let target = "../categories.html";

      if (hash.startsWith("article/")) {
        target = `../article.html?id=${encodeURIComponent(hash.split("/")[1] || "")}`;
      } else if (hash === "search" || query.has("q")) {
        const keyword = query.get("q");
        target = `../search.html${keyword ? `?q=${encodeURIComponent(keyword)}` : ""}`;
      } else if (hash === "manage") {
        target = "../categories.html?mode=manage";
      }

      window.location.replace(target);
    })();
  </script>
</body>
</html>
